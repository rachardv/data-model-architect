verification_queries:
  - name: Semi-Additive Point-in-Time Monthly Closing Balance
    query: >
      WITH ranked_balances AS (
        SELECT 
          b.branch_sk,
          f.account_sk,
          f.ending_balance,
          ROW_NUMBER() OVER (
            PARTITION BY f.account_sk 
            ORDER BY d.calendar_date DESC
          ) AS rn
        FROM fact_daily_account_balances f
        JOIN dim_retail_banking_branch_core b ON f.branch_sk = b.branch_sk
        JOIN dim_date d ON f.snapshot_date_key = d.date_sk
        WHERE d.calendar_year = 2026 AND d.calendar_month = 1
      )
      SELECT CAST(ROUND(SUM(ending_balance), 2) AS DOUBLE)
      FROM ranked_balances
      WHERE rn = 1 AND branch_sk = 'BR-DOWNTOWN';
    assertion_type: scalar_eq
    expected_value: 3300.00
    failure_message: Expected Downtown Jan 2026 closing balance of 3300.00 without temporal inflation

  - name: Cross-Sectional Dimensional Additivity
    query: >
      SELECT CAST(ROUND(SUM(ending_balance), 2) AS DOUBLE)
      FROM fact_daily_account_balances
      WHERE snapshot_date_key = 20260131;
    assertion_type: scalar_eq
    expected_value: 8800.00
    failure_message: Expected total network cross-sectional balance of 8800.00 on 2026-01-31

  - name: Factless Security Event Exact Occurrence Count
    query: >
      SELECT COUNT(*)
      FROM fact_customer_security_events e
      JOIN dim_retail_banking_customer_core c ON e.customer_sk = c.customer_sk
      WHERE c.customer_id = 'C-1001';
    assertion_type: scalar_eq
    expected_value: 2
    failure_message: Expected exactly 2 factless security events logged for customer C-1001

  - name: Aggregate Rollup Parity Against Base Fact Closing Balance
    query: >
      SELECT CAST(ROUND(SUM(total_closing_balance), 2) AS DOUBLE)
      FROM agg_monthly_branch_balances
      WHERE calendar_year = 2026 AND calendar_month = 1;
    assertion_type: scalar_eq
    expected_value: 8800.00
    failure_message: Expected monthly aggregate rollup sum to match base fact closing balance of 8800.00

  - name: Non-Additive Derived Ratio Component Derivation
    query: >
      SELECT CAST(ROUND(total_closing_balance / total_accounts_count, 2) AS DOUBLE)
      FROM agg_monthly_branch_balances
      WHERE calendar_year = 2026 AND calendar_month = 1 AND branch_sk = 'BR-DOWNTOWN';
    assertion_type: scalar_eq
    expected_value: 1650.00
    failure_message: Expected Downtown branch average balance per account of 1650.00
