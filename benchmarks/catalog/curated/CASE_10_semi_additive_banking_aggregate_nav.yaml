case_id: CASE-10
domain: retail_banking
name: Retail Banking Semi-Additive Balances, Factless Events & Rollup Navigation
description: Enterprise retail banking dimensional model managing daily account balance periodic snapshots (semi-additive balance governance across time and entities), factless customer security event logs, and companion monthly branch rollup aggregate navigation routing.
citation: >
  Ralph Kimball & Margy Ross (2013), "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling" (3rd Edition),
  Chapter 7 ("Financial Services: Periodic Snapshot Fact Tables, Semi-Additive Metrics & Factless Facts"), pp. 241-274,
  and Chapter 19 ("Aggregate Navigation and Materialized Summary Tables"), pp. 493-512.
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - banking
  - semi_additive
  - factless_fact
  - aggregate_navigation
  - rollup_summary
  - closing_balance

prompt: >
  We operate an enterprise retail banking platform managing retail checking and savings accounts across national branch networks.
  Every night, a nightly snapshot captures account ending balances and available balances; these metrics are strictly semi-additive
  (additive across accounts, customers, and branches, but strictly non-additive across time, requiring point-in-time closing balance reductions).
  Additionally, security authentication and fraud monitoring requires tracking customer security events (logins, password resets, MFA challenges)
  as a pure factless fact table with zero numeric measures, where the grain is defined solely by the composite dimension foreign keys.
  To accelerate high-throughput executive branch dashboards without scanning multi-billion row daily snapshots, the warehouse maintains
  a companion monthly branch rollup aggregate table with navigation routing that mathematically reconciles with base fact closing balances.

business_answers:
  - "Core business processes: Retail banking account balances, security audit logs, and branch monthly reporting"
  - "Grain: Daily ending balance per account snapshot and discrete security event per customer"
  - "Workload intent: Periodic snapshot fact with semi-additive balances and aggregate rollup navigation"
  - "Dimensions: Conformed customers, accounts, branches, and calendar date"
  - "Temporal policy: SCD Type 2 for customers and accounts with daily periodic balance snapshots"
  - "Lifecycle funnel: Daily balance state snapshot and factless security audit log"
  - "Metrics: ending_balance, available_balance, total_closing_balance"

