verification_queries:
  - name: Reconstructed Customer 360 Current Profile Credit Limit for Enterprise Tier
    query: >
      WITH latest_crm AS (
          SELECT customer_hk, customer_name, crm_tier,
                 ROW_NUMBER() OVER (PARTITION BY customer_hk ORDER BY load_dts DESC) as rn
          FROM sat_crm_customer
      ),
      latest_billing AS (
          SELECT customer_hk, credit_limit_usd, billing_status,
                 ROW_NUMBER() OVER (PARTITION BY customer_hk ORDER BY load_dts DESC) as rn
          FROM sat_billing_customer
      )
      SELECT CAST(ROUND(SUM(b.credit_limit_usd), 2) AS DOUBLE)
      FROM hub_customer h
      JOIN latest_crm c ON h.customer_hk = c.customer_hk AND c.rn = 1
      JOIN latest_billing b ON h.customer_hk = b.customer_hk AND b.rn = 1
      WHERE c.crm_tier = 'ENTERPRISE';
    assertion_type: scalar_eq
    expected_value: 250000.00
    failure_message: Expected total credit limit of 250000.00 USD for current Enterprise tier customer

  - name: Point-in-Time Historical PIT Credit Limit Before Increase
    query: >
      WITH pit_billing AS (
          SELECT customer_hk, credit_limit_usd,
                 ROW_NUMBER() OVER (PARTITION BY customer_hk ORDER BY load_dts DESC) as rn
          FROM sat_billing_customer
          WHERE load_dts <= '2026-01-10 00:00:00+00'
      )
      SELECT CAST(ROUND(b.credit_limit_usd, 2) AS DOUBLE)
      FROM hub_customer h
      JOIN pit_billing b ON h.customer_hk = b.customer_hk AND b.rn = 1
      WHERE h.customer_id = 'CUST-1002';
    assertion_type: scalar_eq
    expected_value: 50000.00
    failure_message: Expected PIT credit limit of 50000.00 USD for CUST-1002 as of 2026-01-10 prior to credit increase

  - name: Zero Orphan Foreign Hash Keys in Customer Account Link
    query: >
      SELECT COUNT(*)
      FROM link_customer_account l
      LEFT JOIN hub_customer c ON l.customer_hk = c.customer_hk
      LEFT JOIN hub_account a ON l.account_hk = a.account_hk
      WHERE c.customer_hk IS NULL OR a.account_hk IS NULL;
    assertion_type: scalar_eq
    expected_value: 0
    failure_message: Expected zero orphan foreign keys in link_customer_account

  - name: Multi-Source Satellite System Isolation Distinct Sources
    query: >
      SELECT COUNT(DISTINCT rec_src)
      FROM (
          SELECT rec_src FROM sat_crm_customer
          UNION ALL
          SELECT rec_src FROM sat_billing_customer
      );
    assertion_type: scalar_eq
    expected_value: 2
    failure_message: Expected exactly 2 distinct source systems isolating CRM and Billing satellites
