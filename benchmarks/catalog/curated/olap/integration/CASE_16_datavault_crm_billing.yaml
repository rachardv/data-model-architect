case_id: CASE-16
domain: enterprise_integration
workload_type: OLAP
name: Enterprise Multi-Source CRM and Billing Data Vault 2.0 Raw Ingestion Layer
description: Multi-source enterprise integration evaluating Raw Data Vault 2.0 with Hubs, Links, and isolated source Satellites using deterministic SHA-256 hash keys, append-only load timestamps, and hash diff delta detection.
citation: >
  Dan Linstedt & Michael Olschimke (2015), "Building a Scalable Data Warehouse with Data Vault 2.0: Analyzing and Managing Big Data",
  Morgan Kaufmann / Elsevier, Chapters 3, 4 & 7 ("The Data Vault Architecture, Modeling Hubs, Links, and Satellites").
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - integration
  - data_vault
  - raw_vault
  - hash_keys
  - olap

prompt: >
  An enterprise B2B conglomerate acquires customer profile and financial relationship data from two independent operational source systems:
  a global Salesforce CRM instance (SRC_SALESFORCE_CRM) and a Stripe/SAP Billing ledger (SRC_STRIPE_BILLING).
  Both systems generate customer natural business keys independently, but customers also possess linked billing accounts.
  Business analysts and compliance auditors require a single auditable raw integration layer that preserves 100% of historical deltas
  without destructive overwrites, avoids ETL orchestration deadlocks between CRM and Billing batch windows, and supports reconstructed Point-in-Time (PIT) Customer 360 views.
  Per Dan Linstedt & Michael Olschimke (2015), we require a Data Vault 2.0 Raw Vault containing Hubs (hub_customer, hub_account),
  an association Link (link_customer_account), and isolated source-specific Satellites (sat_crm_customer, sat_billing_customer)
  keyed on deterministic SHA-256 hash keys, append-only load timestamps, and hash diff attributes.

business_answers:
  - "Core business processes: Enterprise multi-source raw ingestion across CRM and Billing systems"
  - "Grain: One record per natural business key in Hubs, one record per relationship in Links, and one record per attribute delta in Satellites"
  - "Workload intent: Data Vault 2.0 raw enterprise integration layer with Hubs, Links, and source-isolated Satellites"
  - "Dimensions: Core business concepts customer and account, with decoupled relationships and multi-source descriptive satellites"
  - "Temporal policy: Strict append-only auditability with load timestamps (load_dts) and cryptographic SHA-256 hash diff change detection"
  - "Lifecycle funnel: Independent parallel asynchronous ingestion pipelines with reconstructed Point-in-Time PIT views"
  - "Metrics: credit_limit_usd, total_balance_usd"

