case_id: CASE-07
domain: order_to_cash
name: Enterprise Order-to-Cash Bus Matrix
description: Multi-process retail Order-to-Cash value stream orchestrating orders, fulfillment shipments, and payment settlements across conformed customer, product, and date dimensions with zero Cartesian chasm traps.
citation: >
  Ralph Kimball & Margy Ross, The Data Warehouse Toolkit (3rd Edition),
  Chapter 3: "Inventory & Value Chains", pp. 79-116 ("Enterprise Data Warehouse Bus Architecture & Cross-Process Drill-Across Reporting").
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - retail
  - bus_matrix
  - multi_fact
  - drill_across

prompt: >
  We operate an omnichannel enterprise retail platform managing the full Order-to-Cash lifecycle.
  The value stream tracks order checkout, warehouse shipments, and customer payment settlement across separate lifecycle facts.
  All fact tables must share strictly conformed dimensions for customers, products, and calendar dates.
  Cross-process reporting across orders and payments must be executed via drill-across queries to compare booked revenue vs collected payments without join fan-out traps.

business_answers:
  - "Core business processes: Order-to-Cash enterprise value stream with orders, shipments, and payments"
  - "Grain: Order items, shipment packages, and payment transaction attempts"
  - "Workload intent: Enterprise Bus Matrix with shared conformed dimensions and drill-across reporting"
  - "Dimensions: Conformed customers, conformed products, and role-playing calendar dates"
  - "Metrics: total_amount_usd, shipping_cost_usd, payment_amount_usd"

