verification_queries:
  - name: Orders Fact Row Count
    query: "SELECT COUNT(*) FROM fact_order_to_cash_orders WHERE total_amount_usd > 0;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected positive order fact records

  - name: Shipments Distinct Carriers Count
    query: "SELECT COUNT(DISTINCT carrier_name) FROM fact_order_to_cash_shipments;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected valid carrier records in shipments fact

  - name: Settled Payment Revenue Total
    query: "SELECT SUM(payment_amount_usd) FROM fact_order_to_cash_payments WHERE payment_status = 'SETTLED';"
    assertion_type: scalar_gt
    expected_value: 0.0
    failure_message: Expected positive settled payment revenue in payments fact

  - name: Cross-Process Drill-Across Revenue Reconciliation
    query: >
      WITH o_agg AS (
          SELECT customer_sk, SUM(total_amount_usd) AS booked_rev
          FROM fact_order_to_cash_orders
          GROUP BY customer_sk
      ),
      p_agg AS (
          SELECT customer_sk, SUM(payment_amount_usd) AS settled_cash
          FROM fact_order_to_cash_payments
          GROUP BY customer_sk
      )
      SELECT COUNT(*)
      FROM o_agg o
      FULL OUTER JOIN p_agg p ON o.customer_sk = p.customer_sk
      WHERE COALESCE(o.booked_rev, 0.0) = COALESCE(p.settled_cash, 0.0);
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected successful cross-fact drill-across reconciliation without Cartesian inflation
