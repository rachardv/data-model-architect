verification_queries:
  - name: Physician Bridge Allocation Weight Completeness
    query: >
      SELECT CAST(ROUND(SUM(allocation_weight), 2) AS DOUBLE)
      FROM bridge_episode_physician
      GROUP BY episode_id
      ORDER BY episode_id
      LIMIT 1;
    assertion_type: scalar_eq
    expected_value: 1.0
    failure_message: Expected total care team physician allocation weight to equal 1.0 (100.0%)

  - name: Total Inpatient Hospital Charges Reconciliation
    query: >
      SELECT CAST(ROUND(SUM(total_charges_usd), 2) AS DOUBLE)
      FROM fact_clinical_inpatient_episodes;
    assertion_type: scalar_eq
    expected_value: 80000.00
    failure_message: Expected total hospital charges of 80000.00 USD across all episodes

  - name: Weighted Attending Revenue Attribution Without Double Counting
    query: >
      SELECT CAST(ROUND(SUM(f.total_charges_usd * b.allocation_weight), 2) AS DOUBLE)
      FROM fact_clinical_inpatient_episodes f
      JOIN bridge_episode_physician b ON f.episode_id = b.episode_id
      WHERE b.physician_sk = 'DOC-CARD-01';
    assertion_type: scalar_eq
    expected_value: 24500.00
    failure_message: Expected Dr. Sarah Chen weighted revenue attribution of 24500.00 USD (70% of EP-5001)

  - name: Comorbid Secondary Diagnoses Count Per Episode
    query: >
      SELECT COUNT(*)
      FROM bridge_episode_diagnosis
      WHERE episode_id = 'EP-5001' AND diagnosis_type = 'SECONDARY_COMORBIDITY';
    assertion_type: scalar_eq
    expected_value: 2
    failure_message: Expected exactly 2 secondary comorbidity diagnoses for episode EP-5001
