case_id: CASE-13
domain: clinical_healthcare
workload_type: OLAP
name: Clinical Inpatient Episode DRG Comorbidity Bridge & Attending Allocation
description: Hospital clinical inpatient episode dimensional model evaluating acute care hospitalizations, Diagnostic Related Group (DRG) comorbidity groups, attending physician weighting bridges, and allocation factor parity (100.0%) without Cartesian explosion.
citation: >
  Ralph Kimball & Margy Ross (2013), "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling" (3rd Edition),
  Chapter 11 ("Healthcare: Clinical Inpatient Episodes of Care, DRG Comorbidity Grouping & Multi-Valued Treatment Bridge"), pp. 325-356.
hazard_category: BRIDGE_CO_OWNERSHIP
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - healthcare
  - clinical
  - drg
  - bridge
  - allocation_factor
  - multi_valued_dimension
  - kimball

prompt: >
  We operate an acute care regional hospital network tracking clinical inpatient episodes of care.
  When a patient is admitted, they receive clinical treatments overseen by a team of attending, admitting, and consulting physicians.
  Furthermore, each inpatient hospitalization is assigned to a Medicare Severity Diagnosis Related Group (DRG) based on a primary admitting diagnosis combined with multiple secondary comorbid conditions and surgical complications.
  Per Kimball Chapter 11, multiple physicians participating in an episode cannot be forced into a single foreign key without
  misrepresenting clinical responsibility.
  We require a multi-valued physician treatment bridge table with explicit allocation weighting factors (e.g., 70% attending, 30% consulting)
  such that each episode's physician weights sum strictly to 1.0 (100.0%), enabling both weighted revenue attribution and unweighted
  clinical team participation analysis.
  Similarly, comorbidity diagnoses must link through a clinical diagnosis bridge preserving primary vs secondary diagnosis flags
  and present-on-admission indicators without triggering Cartesian row multiplication in episode charge totals.

business_answers:
  - "Core business processes: Clinical hospital inpatient episodes, DRG comorbidity assignment, and multi-physician care team attribution"
  - "Grain: One record per acute inpatient admission episode of care"
  - "Workload intent: Clinical dimensional model with multi-valued physician treatment bridge and diagnosis comorbidity bridge"
  - "Dimensions: Conformed clinical patients with SCD2, attending/consulting physicians, DRG groups, and ICD-10 diagnoses"
  - "Temporal policy: SCD Type 2 for patients, with admit and discharge date keys on the episode fact"
  - "Lifecycle funnel: Patient admission, clinical stay with DRG classification, physician consultations, and discharge billing"
  - "Metrics: total_charges_usd, reimbursement_amount_usd, length_of_stay_days, physician_allocation_weight"

