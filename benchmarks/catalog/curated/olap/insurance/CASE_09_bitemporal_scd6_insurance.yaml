case_id: CASE-09
domain: insurance_policy
name: Bitemporal Insurance Policy & SCD6 Splicing Lifecycle
description: Enterprise property & casualty insurance policy lifecycle tracking retroactive endorsements, SCD Type 6 dual-perspective reporting (as-was vs as-is), closed-open interval splicing, and late-arriving claims with ghost policy surrogate keys.
citation: >
  Ralph Kimball & Margy Ross (2013), "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling" (3rd Edition),
  Chapter 5 ("Slowly Changing Dimension Techniques: Type 6 Hybrid Dimensions & Late-Arriving Data"), pp. 153-188,
  and Martin Fowler (2005), "Bitemporal History".
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - insurance
  - temporal
  - scd6
  - bitemporal
  - late_arriving_facts
  - ghost_keys
  - interval_splicing

prompt: >
  We operate an enterprise commercial property and casualty insurance carrier managing complex policy endorsements and claims lifecycles.
  Underwriting endorsements frequently occur retroactively, requiring historical policy timelines to be spliced into strict closed-open intervals without overlapping validity dates.
  Claims often arrive out-of-order weeks after an incident occurs, referencing policies that have not yet completed ETL ingestion; these must resolve to inferred ghost dimension records with sentinel surrogate keys to prevent catastrophic claim drop-outs.
  To support executive management and actuarial audits simultaneously, the policy dimension must implement Kimball SCD Type 6 hybrid attributes:
  preserving historical point-in-time risk tiers and sales territories (as-was) while maintaining current overwritten attributes (as-is) across all version slices.

business_answers:
  - "Core business processes: Insurance policy lifecycle management and claims processing"
  - "Grain: Individual claim transaction per insurance policy"
  - "Workload intent: Bitemporal SCD Type 6 hybrid dimensional reporting with as-was and as-is perspectives"
  - "Dimensions: Conformed insurance policies with SCD6 hybrid attributes and late-arriving ghost keys"
  - "Temporal policy: Preserve historical policy attributes using SCD Type 6 effective dates and dual-perspective current attributes"
  - "Lifecycle funnel: Discrete single event transaction claim events recorded per policy"
  - "Metrics: claim_amount, settlement_amount"

