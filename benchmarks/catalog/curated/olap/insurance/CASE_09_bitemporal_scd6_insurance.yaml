verification_queries:
  - name: Zero Interval Overlap in Policy Dimension
    query: >
      SELECT COUNT(*) FROM (
        SELECT a.policy_id, a.policy_sk AS sk_a, b.policy_sk AS sk_b
        FROM dim_insurance_policy_scd6 a
        JOIN dim_insurance_policy_scd6 b ON a.policy_id = b.policy_id AND a.policy_sk <> b.policy_sk
        WHERE a.scd_valid_from < b.scd_valid_to AND b.scd_valid_from < a.scd_valid_to
      );
    assertion_type: scalar_eq
    expected_value: 0
    failure_message: Expected zero interval overlap across dimension versions

  - name: Late Arriving Ghost Policy Exists
    query: "SELECT COUNT(*) FROM dim_insurance_policy_scd6 WHERE is_inferred = true;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected inferred ghost policy record for late-arriving claims

  - name: Zero Dropped Claims With Ghost Key Joins
    query: "SELECT COUNT(*) FROM fact_insurance_policy_claims f JOIN dim_insurance_policy_scd6 d ON f.policy_sk = d.policy_sk WHERE f.claim_id >= 80001;"
    assertion_type: scalar_eq
    expected_value: 4
    failure_message: Expected 100% claim retention with zero dropped facts using ghost keys

  - name: Historical Point In Time Risk Tier Aggregation
    query: >
      WITH hist_summary AS (
        SELECT d.historical_risk_tier, SUM(f.claim_amount) AS total_claims
        FROM fact_insurance_policy_claims f
        JOIN dim_insurance_policy_scd6 d ON f.policy_sk = d.policy_sk
        WHERE f.claim_id >= 80001 AND d.historical_risk_tier = 'LOW'
        GROUP BY d.historical_risk_tier
      )
      SELECT COUNT(*) FROM hist_summary WHERE total_claims = 12500.00;
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected historical as-was aggregation to reflect point-in-time risk tier

  - name: Current Perspective Risk Tier Aggregation
    query: >
      WITH curr_summary AS (
        SELECT d.current_risk_tier, SUM(f.claim_amount) AS total_claims
        FROM fact_insurance_policy_claims f
        JOIN dim_insurance_policy_scd6 d ON f.policy_sk = d.policy_sk
        WHERE f.claim_id >= 80001 AND d.current_risk_tier = 'HIGH'
        GROUP BY d.current_risk_tier
      )
      SELECT COUNT(*) FROM curr_summary WHERE total_claims = 65500.00;
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected current as-is Type 1 aggregation to reflect overwritten risk tier across all versions
