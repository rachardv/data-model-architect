verification_queries:
  - name: Recursive Closed Cycle Detection for Depth 3 Mule Ring
    query: >
      WITH RECURSIVE transfer_paths AS (
          SELECT 
              source_account_id AS root_node,
              target_account_id,
              amount_usd,
              1 AS hop_depth,
              [source_account_id, target_account_id] AS path,
              (source_account_id = target_account_id) AS is_cycle
          FROM graph_transfer_edges
          UNION ALL
          SELECT 
              p.root_node,
              e.target_account_id,
              e.amount_usd,
              p.hop_depth + 1,
              list_append(p.path, e.target_account_id),
              (e.target_account_id = p.root_node) AS is_cycle
          FROM transfer_paths p
          JOIN graph_transfer_edges e ON p.target_account_id = e.source_account_id
          WHERE p.hop_depth < 4
            AND NOT (list_contains(p.path[2:], e.target_account_id))
      )
      SELECT COUNT(DISTINCT root_node)
      FROM transfer_paths
      WHERE is_cycle = true AND hop_depth = 3;
    assertion_type: scalar_eq
    expected_value: 3
    failure_message: Expected exactly 3 distinct account root nodes participating in closed circular mule ring

  - name: Total Laundered Volume in Circular Ring
    query: >
      SELECT CAST(ROUND(SUM(amount_usd), 2) AS DOUBLE)
      FROM graph_transfer_edges
      WHERE source_account_id IN ('ACCT-201', 'ACCT-202', 'ACCT-203')
        AND target_account_id IN ('ACCT-201', 'ACCT-202', 'ACCT-203');
    assertion_type: scalar_eq
    expected_value: 29300.00
    failure_message: Expected 29300.00 USD total transfer volume in circular mule ring

  - name: High-Fan-Out Structuring Hub Out-Degree
    query: >
      SELECT COUNT(DISTINCT target_account_id)
      FROM graph_transfer_edges
      WHERE source_account_id = 'ACCT-301';
    assertion_type: scalar_eq
    expected_value: 3
    failure_message: Expected out-degree of 3 outward structuring transfers from ACCT-301

  - name: Linear Legitimate Chain Cycle Immunity
    query: >
      WITH RECURSIVE linear_paths AS (
          SELECT 
              source_account_id AS root_node,
              target_account_id,
              1 AS hop_depth,
              [source_account_id, target_account_id] AS path,
              (source_account_id = target_account_id) AS is_cycle
          FROM graph_transfer_edges
          WHERE source_account_id = 'ACCT-101'
          UNION ALL
          SELECT 
              p.root_node,
              e.target_account_id,
              p.hop_depth + 1,
              list_append(p.path, e.target_account_id),
              (e.target_account_id = p.root_node) AS is_cycle
          FROM linear_paths p
          JOIN graph_transfer_edges e ON p.target_account_id = e.source_account_id
          WHERE p.hop_depth < 4
            AND NOT (list_contains(p.path[2:], e.target_account_id))
      )
      SELECT COUNT(*)
      FROM linear_paths
      WHERE is_cycle = true;
    assertion_type: scalar_eq
    expected_value: 0
    failure_message: Expected zero cycles detected originating from legitimate account ACCT-101
