case_id: CASE-17
domain: aml_fraud
workload_type: OLAP
name: Anti-Money Laundering Financial Transfer Network and Circular Mule Ring Detection
description: Graph OLAP network topology evaluating account nodes and directed transfer edges to detect closed circular money laundering cycles and high-fan-out structuring hubs via recursive CTE graph traversals.
citation: >
  Ian Robinson, Jim Webber & Emil Eifrem (2015), "Graph Databases: New Opportunities for Connected Data" (2nd Edition),
  O'Reilly Media, Chapters 1, 3 & 6 ("Connected Data in Practice, Path Traversals, and Cycle Detection").
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - fraud
  - graph_olap
  - aml
  - recursive_cte
  - cycle_detection
  - olap

prompt: >
  An AML financial crime investigation unit at a major tier-1 bank monitors wire and instant electronic funds transfers
  to detect criminal money laundering syndicates and structuring networks. Criminal organizations routinely execute circular money mule rings:
  illicit funds originate at a source shell account, bounce through multiple intermediary accounts to obfuscate the source of funds,
  and circulate back to the originating entity or an affiliated beneficiary (e.g. Account 201 -> Account 202 -> Account 203 -> Account 201).
  Traditional dimensional star schemas fail to detect these closed directed cycles without brittle, pre-specified join chains.
  Per Robinson, Webber & Eifrem (2015), we require a Graph OLAP network topology comprising an account vertex table (graph_account_nodes)
  and a directed funds transfer edge table (graph_transfer_edges). Analytical queries must execute recursive path traversal in DuckDB
  to identify closed cycles (Cycle Depth >= 3), calculate nodal out-degree fan-out ratios, and isolate criminal rings.

business_answers:
  - "Core business processes: Financial wire transfers, money mule detection, and transaction network graph analysis"
  - "Grain: One record per account entity in nodes, and one record per directed financial transfer event in edges"
  - "Workload intent: Graph OLAP network topology with recursive traversal queries for circular fraud and mule ring detection"
  - "Dimensions: Account nodes with jurisdiction and risk scores, connected by directed weighted transfer edges"
  - "Temporal policy: Preserving historical transfer timestamps on directed temporal edges with bounded multi-hop recursion"
  - "Lifecycle funnel: Continuous electronic transfer stream evaluated via recursive path graph traversals"
  - "Metrics: amount_usd, hop_depth, cycle_count, out_degree"

