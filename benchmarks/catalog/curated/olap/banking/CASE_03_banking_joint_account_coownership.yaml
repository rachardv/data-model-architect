case_id: CASE-03
domain: banking
name: Banking Multi-Owner Joint Account Co-Ownership
description: Retail banking transactions with checking and savings accounts jointly owned by multiple customers with weighting factor splits.
citation: >
  Ralph Kimball & Margy Ross, The Data Warehouse Toolkit (3rd Edition),
  Chapter 11: "Financial Services", pp. 295-326 ("Joint Accounts and Co-Owners with Weighting Factors").
hazard_category: BRIDGE_CO_OWNERSHIP
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - banking
  - coownership
  - kimball

prompt: >
  Consumer retail banking managing checking and savings accounts.
  Accounts can be jointly owned by multiple customers (primary and secondary account holders)
  using weighting factor splits. Transactions track deposits, withdrawals, and balances.
  Customer address and status changes are tracked historically using SCD Type 2.

business_answers:
  - "Core business processes: retail banking account transactions and balance tracking"
  - "Grain: One record per banking transaction"
  - "Dimensions: Customers with SCD2 tracking, and Accounts"
  - "Lifecycle: single standalone transaction events tracking account deposits and withdrawals"
  - "Metrics: total_amount_usd, running_balance_usd"

verification_queries:
  - name: Active SCD2 Customers Check
    query: "SELECT COUNT(*) FROM dim_banking_customer_core WHERE is_current = true;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected active SCD2 customer records

  - name: Transactions Fact Count
    query: "SELECT COUNT(*) FROM fact_banking_orders WHERE total_amount_usd >= 0;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected valid positive transaction rows

  - name: Total Transaction Amount Sum
    query: "SELECT SUM(total_amount_usd) FROM fact_banking_orders;"
    assertion_type: scalar_gt
    expected_value: 0.0
    failure_message: Expected positive non-null total transaction volume
