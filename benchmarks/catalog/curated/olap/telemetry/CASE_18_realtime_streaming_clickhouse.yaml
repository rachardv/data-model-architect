verification_queries:
  - name: Real-Time Campaign Return on Ad Spend ROAS
    query: >
      SELECT CAST(ROUND(SUM(revenue_usd) / SUM(bid_cost_usd), 2) AS DOUBLE)
      FROM stream_ad_clicks
      WHERE campaign_id = 'CMP-901';
    assertion_type: scalar_eq
    expected_value: 3.75
    failure_message: Expected ROAS of 3.75 for campaign CMP-901

  - name: HyperLogLog Approximate Unique Visitor Reach
    query: >
      SELECT CAST(approx_count_distinct(visitor_id) AS BIGINT)
      FROM stream_ad_clicks
      WHERE campaign_id = 'CMP-901';
    assertion_type: scalar_eq
    expected_value: 3
    failure_message: Expected 3 approximate distinct visitors for campaign CMP-901 via HyperLogLog

  - name: Sliding Window Conversion Rate
    query: >
      SELECT CAST(ROUND(COUNT(*) FILTER (WHERE is_converted = true) * 1.0 / COUNT(*), 2) AS DOUBLE)
      FROM stream_ad_clicks
      WHERE campaign_id = 'CMP-901';
    assertion_type: scalar_eq
    expected_value: 0.33
    failure_message: Expected 0.33 conversion rate for campaign CMP-901 in sliding window

  - name: Total Real-Time Streaming Events Ingested
    query: >
      SELECT COUNT(*)
      FROM stream_ad_clicks;
    assertion_type: scalar_eq
    expected_value: 5
    failure_message: Expected exactly 5 streaming events ingested into flat telemetry table
