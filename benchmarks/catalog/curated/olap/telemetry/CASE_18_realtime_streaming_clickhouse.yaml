case_id: CASE-18
domain: telemetry
workload_type: OLAP
name: Real-Time Columnar Streaming Ad Telemetry and Clickstream Mart
description: High-velocity real-time columnar streaming OLAP evaluating wide denormalized event streams, HyperLogLog approximate distinct sketches, and sub-second windowed aggregations without runtime relational joins.
citation: >
  Alexey Milovidov et al. (2024), "ClickHouse: Ultra-Fast Analytical DBMS Architecture", ClickHouse Documentation & VLDB.
  Also Apache Pinot Real-Time Distributed Columnar OLAP Engine (VLDB 2021).
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - telemetry
  - realtime_streaming
  - clickhouse
  - hyperloglog
  - streaming_olap
  - olap

prompt: >
  An ad-tech programmatic bidding platform processes over 100,000 real-time ad impression and click events per second.
  Marketing analytics teams and automated bidder engines require real-time campaign performance dashboards reporting
  Return on Ad Spend (ROAS), conversion rates, and unique visitor reach over rolling 5-minute sliding windows with sub-second p99 latency.
  Traditional normalized star schemas fail under this workload due to foreign key join overhead and write contention on dimension tables.
  Per Alexey Milovidov et al. (2024) and Apache Pinot architecture standards, we require a Real-Time Columnar Streaming OLAP table
  (stream_ad_clicks) where all dimensional attributes (campaign, ad placement, visitor, device category, geo country)
  are denormalized directly into the high-velocity streaming event record at ingestion time.
  Analytical queries must compute sub-second aggregations, utilize HyperLogLog approximate distinct counting (approx_count_distinct)
  for visitor reach, and execute with zero joins.

business_answers:
  - "Core business processes: Real-time ad telemetry, clickstream ingestion, and programmatic conversion tracking"
  - "Grain: One record per ad click or conversion interaction event"
  - "Workload intent: Real-time columnar streaming OLAP with wide denormalized event stream and HyperLogLog approximate sketches"
  - "Dimensions: Flattened dimensions (campaign, ad placement, visitor, device, geo) embedded directly on the streaming event record"
  - "Temporal policy: Fine-grained event ingestion timestamps (event_timestamp) with rolling time-window aggregations"
  - "Lifecycle funnel: Continuous streaming event ingestion with sub-second real-time dashboard scans"
  - "Metrics: bid_cost_usd, revenue_usd, roas, approx_unique_visitors, conversion_rate"

