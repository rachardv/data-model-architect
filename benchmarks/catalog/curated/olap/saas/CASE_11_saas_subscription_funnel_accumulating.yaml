verification_queries:
  - name: Active Enterprise MRR Sum
    query: >
      SELECT CAST(ROUND(SUM(mrr_amount_usd), 2) AS DOUBLE)
      FROM fact_subscription_funnel_accumulating
      WHERE is_active = true;
    assertion_type: scalar_eq
    expected_value: 5000.00
    failure_message: Expected active subscription MRR sum to match 5000.00

  - name: Trial-to-Activation Conversion Rate
    query: >
      SELECT CAST(ROUND(CAST(COUNT(activation_date_key) AS DOUBLE) / COUNT(trial_date_key) * 100.0, 1) AS DOUBLE)
      FROM fact_subscription_funnel_accumulating;
    assertion_type: scalar_eq
    expected_value: 66.7
    failure_message: Expected trial to activation conversion rate of 66.7%

  - name: Average Days from Trial to Activation for Activated Subscriptions
    query: >
      SELECT CAST(ROUND(AVG(trial_to_activation_days), 1) AS DOUBLE)
      FROM fact_subscription_funnel_accumulating
      WHERE activation_date_key IS NOT NULL;
    assertion_type: scalar_eq
    expected_value: 16.5
    failure_message: Expected average trial-to-activation lag of 16.5 days

  - name: Churn Cohort Count
    query: >
      SELECT COUNT(*)
      FROM fact_subscription_funnel_accumulating
      WHERE is_churned = true;
    assertion_type: scalar_eq
    expected_value: 2
    failure_message: Expected exactly 2 churned subscription records
