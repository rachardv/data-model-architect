case_id: CASE-11
domain: saas_subscription
workload_type: OLAP
name: SaaS Subscription Funnel Accumulating Snapshot & Milestone Lag
description: Enterprise B2B SaaS recurring subscription lifecycle model evaluating an accumulating snapshot fact table tracking milestone timestamps (lead, trial, activation, first renewal, expansion, cancellation), milestone lag days, cohort churn rates, and zero metric drift in DuckDB.
citation: >
  Ralph Kimball & Margy Ross (2013), "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling" (3rd Edition),
  Chapter 14 ("Accounting & Subscription Services: Accumulating Snapshot Fact Tables for Multi-Stage Lifecycle Funnels & Cohort Churn"), pp. 385-412.
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - saas
  - subscription
  - accumulating_snapshot
  - milestone_lag
  - cohort_churn
  - kimball

prompt: >
  We operate an enterprise B2B SaaS platform delivering cloud-based subscription software.
  Our go-to-market and customer success teams require visibility across the entire multi-stage customer lifecycle:
  from marketing lead generation, self-serve trial sign-up, paid contract activation, tier upgrades, annual renewal,
  through to eventual churn or cancellation.
  Because subscriptions evolve over time across well-defined operational milestones with variable duration between steps,
  standard transaction facts fail to answer funnel velocity questions efficiently.
  We require an accumulating snapshot fact table where each record represents a single subscription lifecycle journey.
  As a customer transitions across milestones, their accumulating snapshot record is progressively updated with milestone date keys
  and lag metrics (days from lead to trial, days from trial to activation, and total subscription lifetime days).
  BI dashboards must query milestone lag distributions, cohort conversion rates, active Monthly Recurring Revenue (MRR),
  and churn rates with zero Cartesian fan-out or temporal metric inflation.

business_answers:
  - "Core business processes: SaaS subscription lifecycle funnel tracking, milestone conversions, and churn analysis"
  - "Grain: One record per subscription contract lifecycle journey (accumulating snapshot fact)"
  - "Workload intent: Accumulating snapshot dimensional mart with milestone lag metrics and progressive timestamp updates"
  - "Dimensions: Conformed customer accounts with SCD2 history, subscription product plans, and role-playing date milestones"
  - "Temporal policy: SCD Type 2 for customer accounts and plan tiers, with accumulating milestone dates on the subscription fact"
  - "Lifecycle funnel: Accumulating snapshot with milestones: lead_date, trial_date, activation_date, renewal_date, churn_date"
  - "Metrics: mrr_amount_usd, arr_amount_usd, lead_to_trial_days, trial_to_activation_days, subscription_lifetime_days"

