    - ping_id: 50004
      vehicle_sk: "VEH-002"
      ping_date_key: 20260116
      speed_mph: 59.5
      engine_temp_c: 86.1
      fuel_level_pct: 81.2
      odometer_miles: 89138.1

verification_queries:
  - name: Fact Telematics Row Count
    query: "SELECT COUNT(*) FROM fact_telematics_mpp_pings WHERE speed_mph > 0;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected positive telematics sensor ping events

  - name: Fleet Vehicle Dimension Exists
    query: "SELECT COUNT(*) FROM dim_telematics_mpp_vehicle_core WHERE status = 'ACTIVE';"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected active vehicles in vehicle dimension

  - name: Partition Pruning Single Date Filter
    query: "SELECT COUNT(*) FROM fact_telematics_mpp_pings WHERE ping_date_key = 20260115;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected valid row return on partition key filtered query

  - name: Co-located Cluster Join Vehicle Telemetry
    query: >
      WITH grouped_telemetry AS (
        SELECT v.vehicle_name, AVG(f.speed_mph) AS avg_speed
        FROM fact_telematics_mpp_pings f
        JOIN dim_telematics_mpp_vehicle_core v ON f.vehicle_sk = v.vehicle_sk
        WHERE f.ping_date_key >= 20260115
        GROUP BY v.vehicle_name
      )
      SELECT COUNT(*) FROM grouped_telemetry WHERE avg_speed > 50.0;
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected successful aggregation across partitioned and clustered join keys
