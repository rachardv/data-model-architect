case_id: CASE-01
domain: retail
name: Enterprise Retail Kimball Star Mart
description: Clean baseline dimensional model evaluating retail customer orders with SCD2 customer dimensions and DuckDB execution.
citation: >
  Ralph Kimball & Margy Ross, The Data Warehouse Toolkit (3rd Edition),
  Chapter 2: "Retail Sales", pp. 37-78 ("Kimball Star Schema & SCD Type 2 Customer Tracking").
hazard_category: CLEAN_BASELINE
is_intentional_trap: false
expected_status: CERTIFIED_PRODUCTION_READY
tags:
  - curated
  - retail
  - baseline
  - kimball

prompt: >
  We operate an omnichannel retail business where customers place merchandise orders.
  Orders have order status, total sales amount, and estimated delivery dates.
  Customer address and status changes must be tracked historically using SCD Type 2.

business_answers:
  - "Core business processes: retail merchandise sales orders and customer tracking"
  - "Grain: One record per order"
  - "Dimensions: Customers with SCD2 tracking, and Products"
  - "Metrics: total_amount_usd, estimated_delivery_days"

verification_queries:
  - name: Customer Dimension Active Records
    query: "SELECT COUNT(*) FROM dim_retail_customer_core WHERE is_current = true;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected active SCD2 customer records in dimension

  - name: Orders Fact Grain Row Count
    query: "SELECT COUNT(*) FROM fact_retail_orders WHERE total_amount_usd >= 0;"
    assertion_type: scalar_gt
    expected_value: 0
    failure_message: Expected valid positive order fact rows

  - name: Positive Metric Revenue Total
    query: "SELECT SUM(total_amount_usd) FROM fact_retail_orders;"
    assertion_type: scalar_gt
    expected_value: 0.0
    failure_message: Expected positive non-null total order revenue
